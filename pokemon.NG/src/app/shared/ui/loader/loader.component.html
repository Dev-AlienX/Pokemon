<div class="card-grid">
  @for (_ of items; track $index) {
    <div class="card skeleton-card glass-effect">
      <div class="card-image skeleton-image"></div>
      <div class="card-info">
        <span class="id-badge skeleton-text skeleton-id"></span>
        <h3 class="title skeleton-text skeleton-name"></h3>
      </div>
    </div>
  }
</div>
